
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How to Fish</title>

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #000;
      outline: none;
    }

    #loading {
      position: absolute;
      z-index: 2;
      width: min(420px, 90%);
      text-align: center;
    }

    #title {
      font-size: 28px;
      margin-bottom: 22px;
    }

    #progress {
      height: 12px;
      border-radius: 8px;
      background: #333;
      overflow: hidden;
    }

    #progress-fill {
      height: 100%;
      width: 0%;
      background: #69c9ff;
      transition: width .15s;
    }

    #status {
      margin-top: 12px;
      color: #ccc;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    #error {
      display: none;
      position: fixed;
      z-index: 5;
      inset: 12px;
      overflow: auto;
      padding: 20px;
      background: #260b0b;
      border: 1px solid #b44;
      border-radius: 8px;
      color: #fff;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #controls {
      position: fixed;
      z-index: 3;
      right: 12px;
      top: 12px;
    }

    button {
      border: 0;
      border-radius: 6px;
      padding: 10px 14px;
      background: #252525;
      color: white;
      cursor: pointer;
    }

    button:hover { background: #444; }

    #retry {
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <main id="game">
    <canvas id="unity-canvas" tabindex="-1"></canvas>

    <section id="loading">
      <div id="title">How to Fish</div>
      <div id="progress">
        <div id="progress-fill"></div>
      </div>
      <div id="status">Checking game files...</div>
    </section>
  </main>

  <div id="controls">
    <button id="fullscreen">Fullscreen</button>
  </div>

  <section id="error">
    <h2>Unable to load How to Fish</h2>
    <div id="error-message"></div>
    <button id="retry">Try again</button>
  </section>

  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");
    const status = document.getElementById("status");
    const fill = document.getElementById("progress-fill");
    const errorBox = document.getElementById("error");
    const errorMessage = document.getElementById("error-message");

    let unityInstance = null;

    function showError(message) {
      errorBox.style.display = "block";
      errorMessage.textContent = message;
      status.textContent = "Loading failed.";
    }

    async function checkFile(url) {
      const response = await fetch(url, { method: "HEAD" });
      if (!response.ok) {
        throw new Error(
          "Missing or inaccessible file: " + url +
          "\nHTTP status: " + response.status
        );
      }
    }

    async function startGame() {
      errorBox.style.display = "none";
      loading.style.display = "block";
      fill.style.width = "0%";
      status.textContent = "Checking Unity files...";

      try {
        const base = "Build/";
        const loaderUrl = base + "WebGL.loader.js";
        const frameworkUrl = base + "WebGL.framework.js";
        const dataUrl = base + "WebGL.data";
        const codeUrl = base + "WebGL.wasm";

        await checkFile(loaderUrl);
        await checkFile(frameworkUrl);
        await checkFile(dataUrl);
        await checkFile(codeUrl);

        status.textContent = "Loading Unity engine...";

        if (typeof createUnityInstance !== "undefined") {
          await launchUnity(
            dataUrl, frameworkUrl, codeUrl
          );
          return;
        }

        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = async () => {
          try {
            await launchUnity(
              dataUrl, frameworkUrl, codeUrl
            );
          } catch (e) {
            showError(e.message || String(e));
          }
        };

        script.onerror = () => {
          showError("Could not load " + loaderUrl);
        };

        document.body.appendChild(script);
      } catch (e) {
        showError(
          (e.message || String(e)) +
          "\n\nMake sure the original Build files are present " +
          "beside this HTML file and that you are serving the " +
          "folder over HTTP or HTTPS."
        );
      }
    }

    function launchUnity(dataUrl, frameworkUrl, codeUrl) {
      const config = {
        dataUrl: dataUrl,
        frameworkUrl: frameworkUrl,
        codeUrl: codeUrl,
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Game",
        productName: "How to Fish",
        productVersion: "1.0"
      };

      return createUnityInstance(
        canvas,
        config,
        progress => {
          fill.style.width =
            Math.round(progress * 100) + "%";
          status.textContent =
            "Loading game: " +
            Math.round(progress * 100) + "%";
        }
      ).then(instance => {
        unityInstance = instance;
        loading.style.display = "none";
      });
    }

    document.getElementById("fullscreen").onclick = () => {
      if (unityInstance) {
        unityInstance.SetFullscreen(1);
      } else if (canvas.requestFullscreen) {
        canvas.requestFullscreen();
      }
    };

    document.getElementById("retry").onclick = startGame;

    startGame();
  </script>
</body>
</html>
