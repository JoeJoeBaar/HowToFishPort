
<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Fish</title>
<style>
html,body,#unity-container {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}
#unity-container { position:absolute; inset:0; }
#unity-canvas { width:100%; height:100%; display:block; outline:none; }
#loading {
  position:fixed;
  inset:0;
  z-index:10;
  background:#111;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:20px;
  gap:12px;
}
#bar { width:min(440px,90vw); height:8px; background:#444; }
#progress { width:0%; height:100%; background:#fff; }
#status { text-align:center; font-size:14px; }
#error {
  max-width:90vw;
  color:#ff8b8b;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  font-size:13px;
}
#log {
  max-width:90vw;
  max-height:25vh;
  overflow:auto;
  color:#bbb;
  font-size:11px;
  white-space:pre-wrap;
}
button { padding:8px 14px; cursor:pointer; }
</style>
</head>
<body>

<div id="unity-container">
  <canvas id="unity-canvas" tabindex="-1"></canvas>
</div>

<div id="loading">
  <strong>HOW TO FISH</strong>
  <div id="bar"><div id="progress"></div></div>
  <div id="status">Preparing game files...</div>
  <div id="error"></div>
  <div id="log"></div>
  <button id="retry" hidden onclick="location.reload()">Retry</button>
</div>

<script>
"use strict";

const BASE =
  "https://cdn.jsdelivr.net/gh/NotRexed/HowToFishPort@main/Build/";

const canvas = document.getElementById("unity-canvas");
const status = document.getElementById("status");
const progress = document.getElementById("progress");
const errorBox = document.getElementById("error");
const log = document.getElementById("log");
const retry = document.getElementById("retry");

const objectURLs = [];

function report(message) {
  status.textContent = message;
}

function logLine(message) {
  log.textContent += message + "\n";
  log.scrollTop = log.scrollHeight;
  console.log(message);
}

function fail(error) {
  console.error(error);
  report("Game failed to start");
  errorBox.textContent = error?.stack || error?.message || String(error);
  retry.hidden = false;
}

async function download(url) {
  const response = await fetch(url, { cache: "no-store" });

  if (!response.ok) {
    throw new Error(
      "Download failed: " + url + "\nHTTP " + response.status
    );
  }

  const bytes = await response.arrayBuffer();

  if (!bytes.byteLength) {
    throw new Error("Downloaded an empty file:\n" + url);
  }

  // Detect a CDN error page returned with HTTP 200.
  const first = new TextDecoder().decode(bytes.slice(0, 100));
  if (/^\s*<(?:!doctype html|html)\b/i.test(first)) {
    throw new Error("The CDN returned HTML instead of binary data:\n" + url);
  }

  logLine(url.split("/").pop() + ": " + bytes.byteLength + " bytes");
  return bytes;
}

async function combineFiles(urls, label) {
  const parts = [];
  let total = 0;

  for (let i = 0; i < urls.length; i++) {
    report("Downloading " + label + " part " + (i + 1) +
           " of " + urls.length + "...");

    const bytes = await download(urls[i]);
    parts.push(bytes);
    total += bytes.byteLength;

    progress.style.width =
      Math.round((i + 1) / urls.length * 60) + "%";
  }

  const blob = new Blob(parts, {
    type: label === "WASM"
      ? "application/wasm"
      : "application/octet-stream"
  });

  if (blob.size !== total) {
    throw new Error(label + " combined size check failed.");
  }

  logLine(label + " TOTAL: " + blob.size + " bytes");
  const url = URL.createObjectURL(blob);
  objectURLs.push(url);
  return url;
}

async function loadScriptAsBlob(url) {
  report("Downloading " + url.split("/").pop() + "...");

  const bytes = await download(url);
  const source = new TextDecoder().decode(bytes);

  const blob = new Blob([source], { type: "text/javascript" });
  const blobURL = URL.createObjectURL(blob);
  objectURLs.push(blobURL);
  return blobURL;
}

async function start() {
  try {
    const dataFiles = [
      "WebGL.data.part1",
      "WebGL.data.part2",
      "WebGL.data.part3",
      "WebGL.data.part4",
      "WebGL.data.part5",
      "WebGL.data.part6",
      "WebGL.data.part7"
    ].map(name => BASE + name);

    const wasmFiles = [
      "WebGL.wasm.000",
      "WebGL.wasm.001",
      "WebGL.wasm.002",
      "WebGL.wasm.003"
    ].map(name => BASE + name);

    const wasmURL = await combineFiles(wasmFiles, "WASM");
    const dataURL = await combineFiles(dataFiles, "DATA");

    // Check the WebAssembly magic header after combining.
    const wasmResponse = await fetch(wasmURL);
    const wasmHeader = new Uint8Array(await wasmResponse.arrayBuffer());

    if (
      wasmHeader.length < 8 ||
      wasmHeader[0] !== 0x00 ||
      wasmHeader[1] !== 0x61 ||
      wasmHeader[2] !== 0x73 ||
      wasmHeader[3] !== 0x6d
    ) {
      throw new Error(
        "Combined WASM has an invalid header. " +
        "The first part may be incorrect or the files may be mismatched."
      );
    }

    logLine("WASM header is valid.");
    logLine("Combined WASM size: " + wasmHeader.length + " bytes");

    report("Loading Unity scripts...");
    const loaderURL = await loadScriptAsBlob(BASE + "WebGL.loader.js");
    const frameworkURL = await loadScriptAsBlob(BASE + "WebGL.framework.js");

    await new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = loaderURL;
      script.onload = resolve;
      script.onerror = () =>
        reject(new Error("Unity loader script could not start."));
      document.head.appendChild(script);
    });

    if (typeof createUnityInstance !== "function") {
      throw new Error("createUnityInstance was not found.");
    }

    report("Starting Unity...");

    const config = {
      dataUrl: dataURL,
      frameworkUrl: frameworkURL,
      codeUrl: wasmURL,
      streamingAssetsUrl: BASE + "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "How to Fish",
      productVersion: "1.0",
      showBanner: (message, type) => {
        logLine("Unity " + (type || "message") + ": " + message);
      },
      autoSyncPersistentDataPath: true,
      cacheControl: () => "no-store"
    };

    const instance = await createUnityInstance(
      canvas,
      config,
      value => {
        progress.style.width =
          Math.round(60 + value * 40) + "%";
        report("Starting game: " + Math.round(value * 100) + "%");
      }
    );

    window.unityInstance = instance;
    report("Game loaded!");
    document.getElementById("loading").style.display = "none";

  } catch (error) {
    fail(error);
  }
}

start();
</script>
</body>
</html>
