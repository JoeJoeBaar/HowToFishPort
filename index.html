<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Fish - File Diagnostic</title>
<style>
body {
  margin: 0;
  background: #111;
  color: #eee;
  font-family: Arial, sans-serif;
  padding: 20px;
}
pre {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #222;
  padding: 15px;
  border-radius: 8px;
}
</style>
</head>
<body>
<h2>How to Fish — WASM Diagnostic</h2>
<p>Checking the game files from your GitHub fork...</p>
<pre id="log">Starting...</pre>

<script>
const base =
  "https://cdn.jsdelivr.net/gh/JoeJoeBaar/HowToFishPort@main/Build/";

const log = document.getElementById("log");

function print(message) {
  log.textContent += "\n" + message;
}

async function checkFile(name) {
  print("Downloading " + name + "...");
  const response = await fetch(base + name + "?check=" + Date.now());

  if (!response.ok) {
    throw new Error(name + " returned HTTP " + response.status);
  }

  const buffer = await response.arrayBuffer();
  print(name + ": " + buffer.byteLength.toLocaleString() + " bytes");
  return new Uint8Array(buffer);
}

async function run() {
  log.textContent = "";

  try {
    const parts = [];

    for (const suffix of ["000", "001", "002", "003"]) {
      parts.push(await checkFile("WebGL.wasm." + suffix));
    }

    const total = parts.reduce((sum, part) => sum + part.length, 0);
    print("\nWASM TOTAL: " + total.toLocaleString() + " bytes");

    const combined = new Uint8Array(total);
    let offset = 0;

    for (const part of parts) {
      combined.set(part, offset);
      offset += part.length;
    }

    print("Combined bytes: " + offset.toLocaleString());
    print(
      "WASM magic header: " +
      Array.from(combined.slice(0, 4))
        .map(b => b.toString(16).padStart(2, "0"))
        .join(" ")
    );

    print("\nDiagnostic finished. No game was started.");
  } catch (error) {
    print("\nERROR: " + error.message);
  }
}

run();
</script>
</body>
</html>
