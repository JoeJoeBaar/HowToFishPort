
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How To Fish</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
    }

    #game {
      width: 100%;
      height: 100%;
      display: block;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      color: white;
      font: 18px Arial, sans-serif;
    }
  </style>
</head>
<body>
  <div id="loading">Loading How To Fish...</div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const loading = document.getElementById("loading");
    const build = "Build/";

    const config = {
      dataUrl: [
        build + "WebGL.data.part1",
        build + "WebGL.data.part2",
        build + "WebGL.data.part3",
        build + "WebGL.data.part4",
        build + "WebGL.data.part5",
        build + "WebGL.data.part6",
        build + "WebGL.data.part7"
      ],
      frameworkUrl: build + "WebGL.framework.js",
      codeUrl: [
        build + "WebGL.wasm.000",
        build + "WebGL.wasm.001",
        build + "WebGL.wasm.002",
        build + "WebGL.wasm.003"
      ],
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HowToFishPort",
      productName: "How To Fish",
      productVersion: "1.0"
    };

    const script = document.createElement("script");
    script.src = build + "WebGL.loader.js";

    script.onload = () => {
      createUnityInstance(canvas, config, progress => {
        loading.textContent =
          "Loading How To Fish: " +
          Math.round(progress * 100) + "%";
      })
      .then(() => loading.remove())
      .catch(error => {
        loading.textContent = "Game loading failed. Check the console.";
        console.error(error);
      });
    };

    script.onerror = () => {
      loading.textContent =
        "Cannot find Build/WebGL.loader.js. Check your folders.";
    };

    document.body.appendChild(script);
  </script>
</body>
</html>
