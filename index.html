
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How To Fish</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
    }

    #unity-container {
      width: 100%;
      height: 100%;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #111;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font: 20px Arial, sans-serif;
      background: #111;
      z-index: 2;
    }

    #error {
      color: #ffb3b3;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>
  <div id="loading">Loading How To Fish...</div>

  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById("unity-canvas");
    const loading = document.getElementById("loading");

    // Change these names to match your Build folder.
    const buildPath = "Build";
    const buildName = "WebGL";

    const config = {
      dataUrl: `${buildPath}/${buildName}.data`,
      frameworkUrl: `${buildPath}/${buildName}.framework.js`,
      codeUrl: `${buildPath}/${buildName}.wasm`,
      streamingAssetsUrl: "StreamingAssets",
      companyName: "HowToFishPort",
      productName: "How To Fish",
      productVersion: "1.0"
    };

    const loader = document.createElement("script");
    loader.src = `${buildPath}/${buildName}.loader.js`;

    loader.onload = () => {
      if (typeof createUnityInstance !== "function") {
        loading.textContent = "Unity loader was found, but did not initialize.";
        return;
      }

      createUnityInstance(canvas, config, progress => {
        loading.textContent =
          `Loading How To Fish... ${Math.round(progress * 100)}%`;
      })
      .then(() => {
        loading.remove();
      })
      .catch(error => {
        loading.innerHTML =
          '<div id="error">Could not load the game. Check the Build filenames and browser console.</div>';
        console.error(error);
      });
    };

    loader.onerror = () => {
      loading.textContent =
        `Cannot find ${buildPath}/${buildName}.loader.js. Check your filenames.`;
    };

    document.body.appendChild(loader);
  </script>
</body>
</html>
